version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safe_circle_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    volumes:
      - safe_circle_uploads:/app/uploads
    networks:
      - safe_circle_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: safe_circle_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - safe_circle_uploads:/app/uploads:ro
    depends_on:
      - backend
    networks:
      - safe_circle_net

  # Optional local database container (used for local testing or single-instance deployments)
  postgres:
    image: postgres:16-alpine
    container_name: safe_circle_local_postgres
    restart: unless-stopped
    profiles:
      - local
    environment:
      POSTGRES_DB: ${DB_NAME:-safe_circle}
      POSTGRES_USER: ${DB_USER:-safe_circle_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - "5432:5432"
    volumes:
      - safe_circle_local_db_data:/var/lib/postgresql/data
    networks:
      - safe_circle_net

networks:
  safe_circle_net:
    driver: bridge

volumes:
  safe_circle_uploads:
    name: safe_circle_uploads
  safe_circle_local_db_data:
    name: safe_circle_local_db_data
